services:
  - type: web
    name: bookmarked
    runtime: node
    buildCommand: npm install --omit=optional && npm run build
    startCommand: node backend/dist/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.18.0
